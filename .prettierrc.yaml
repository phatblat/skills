# proseWrap is "preserve", not "always": a `.changes/*.md` release-note
# fragment must be one unwrapped line per bullet (see .changes/README.md),
# and prettier's "always" would hard-wrap it at printWidth. markdownlint's
# MD013 is off to match.
printWidth: 80
proseWrap: preserve
tabWidth: 2
useTabs: false
endOfLine: lf
semi: true
singleQuote: true
trailingComma: all
# Fenced examples in this repo are illustrative and include deliberate
# counter-examples; prettier must not reformat code block contents.
embeddedLanguageFormatting: 'off'
